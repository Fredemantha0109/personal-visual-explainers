<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel：自動デプロイの係</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: clamp(16px, 5vw, 24px);
      min-height: 100vh;
    }
    .container {
      max-width: clamp(320px, 100%, 850px);
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(24px, 6vw, 32px);
      margin-bottom: clamp(12px, 3vw, 16px);
      text-align: center;
      color: #60a5fa;
      font-weight: 700;
    }
    .subtitle {
      font-size: clamp(13px, 4vw, 15px);
      text-align: center;
      color: #94a3b8;
      margin-bottom: clamp(24px, 6vw, 32px);
    }
    .flow-section {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(100, 165, 250, 0.2);
      border-radius: 12px;
      padding: clamp(16px, 5vw, 24px);
      margin-bottom: clamp(16px, 4vw, 20px);
    }
    .flow-title {
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: clamp(12px, 3vw, 16px);
    }
    .flow-step {
      display: flex;
      gap: clamp(12px, 3vw, 16px);
      margin-bottom: clamp(12px, 3vw, 16px);
      align-items: flex-start;
    }
    .step-badge {
      min-width: clamp(32px, 8vw, 40px);
      width: clamp(32px, 8vw, 40px);
      height: clamp(32px, 8vw, 40px);
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: clamp(14px, 3vw, 16px);
      flex-shrink: 0;
    }
    .step-content {
      flex: 1;
    }
    .step-label {
      font-weight: 600;
      color: #f1f5f9;
      font-size: clamp(14px, 3.5vw, 16px);
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: clamp(13px, 3vw, 14px);
      color: #cbd5e1;
      line-height: 1.5;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(12px, 3vw, 16px);
      margin-top: clamp(16px, 4vw, 20px);
    }
    @media (min-width: 600px) {
      .features-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .feature-card {
      background: rgba(15, 23, 42, 0.5);
      border-left: 3px solid #60a5fa;
      padding: clamp(12px, 3vw, 16px);
      border-radius: 8px;
    }
    .feature-title {
      font-weight: 600;
      color: #60a5fa;
      font-size: clamp(13px, 3.5vw, 15px);
      margin-bottom: 6px;
    }
    .feature-desc {
      font-size: clamp(12px, 2.8vw, 13px);
      color: #cbd5e1;
      line-height: 1.5;
    }
    .comparison {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(100, 165, 250, 0.15);
      border-radius: 8px;
      padding: clamp(12px, 3vw, 16px);
      margin-top: clamp(16px, 4vw, 20px);
    }
    .comparison-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(16px, 4vw, 20px);
      margin-bottom: clamp(12px, 3vw, 16px);
    }
    .comparison-row:last-child {
      margin-bottom: 0;
    }
    .comp-item {
      font-size: clamp(12px, 3vw, 14px);
    }
    .comp-label {
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      font-size: clamp(11px, 2.8vw, 12px);
    }
    .comp-value {
      color: #f1f5f9;
      font-size: clamp(13px, 3vw, 15px);
    }
    .footer {
      text-align: center;
      margin-top: clamp(20px, 5vw, 28px);
      padding-top: clamp(16px, 4vw, 20px);
      border-top: 1px solid rgba(100, 165, 250, 0.1);
      font-size: clamp(11px, 2.5vw, 12px);
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Vercel</h1>
    <p class="subtitle">GitHubからの自動公開係</p>

    <div class="flow-section">
      <div class="flow-title">どう動く？</div>
      <div class="flow-step">
        <div class="step-badge">1</div>
        <div class="step-content">
          <div class="step-label">コードをpush</div>
          <div class="step-desc">GitHubにコードをアップロード</div>
        </div>
      </div>
      <div class="flow-step">
        <div class="step-badge">2</div>
        <div class="step-content">
          <div class="step-label">自動ビルド</div>
          <div class="step-desc">Vercelが即座にビルド開始</div>
        </div>
      </div>
      <div class="flow-step">
        <div class="step-badge">3</div>
        <div class="step-content">
          <div class="step-label">本番公開</div>
          <div class="step-desc">URLにアクセスしたら、最新版が見える</div>
        </div>
      </div>
    </div>

    <div class="flow-section">
      <div class="flow-title">何が便利か？</div>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-title">🔍 プレビュー環境</div>
          <div class="feature-desc">本番に反映する前に、テスト用URLで試運転できる</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">🔐 環境変数管理</div>
          <div class="feature-desc">APIキーなど秘密情報を安全に保存</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">⚡ 高速配信</div>
          <div class="feature-desc">CDN・Edge Networkで世界どこからでも素早くアクセス</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">↩️ ワンクリック復旧</div>
          <div class="feature-desc">ボタン1つで前のバージョンに戻せる（ロールバック）</div>
        </div>
      </div>
    </div>

    <div class="flow-section">
      <div class="flow-title">Surgeとの違い</div>
      <div class="comparison">
        <div class="comparison-row">
          <div class="comp-item">
